[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqltrace"
version = "0.1.0"
description = "Fresh-context SQL discovery and trace contracts"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[project.scripts]
sqltrace = "sqltrace.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
